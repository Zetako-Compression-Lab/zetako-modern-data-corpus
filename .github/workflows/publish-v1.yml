name: Publish ZMDC-1G v1.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-zmdc-v1]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Install generator
        run: python -m pip install -e .

      - name: Generate frozen reference corpus
        run: |
          mkdir -p dist
          python -m zmdc generate \
            --version 1.0 \
            --seed 20260914 \
            --size 1GB \
            --output dist/ZMDC-1G-v1

      - name: Validate generated corpus
        run: python -m zmdc validate dist/ZMDC-1G-v1

      - name: Verify against frozen reference
        shell: python
        run: |
          import json
          from pathlib import Path

          frozen = json.loads(Path('manifests/ZMDC-1G-v1.json').read_text())
          generated = json.loads(Path('dist/ZMDC-1G-v1/manifest.json').read_text())
          freeze = json.loads(Path('FREEZE.json').read_text())

          expected = {
              'global_sha256': '34b3479f61272231502cfa3f923d5780548b4f08d9dd733306f5d70b30589a7f',
              'primary_bytes': 1000037807,
              'records': 951552,
          }
          for key, value in expected.items():
              assert frozen[key] == value, (key, frozen[key], value)
              assert generated[key] == value, (key, generated[key], value)

          assert generated['implementation_sha256'] == freeze['implementation_sha256']
          assert generated['specification_sha256'] == freeze['specification_sha256']
          assert generated['seed'] == 20260914
          assert generated['python_implementation'] == 'CPython'
          assert generated['python_version'] == '3.12.10'

          ffiles = {x['path']: x for x in frozen['files']}
          gfiles = {x['path']: x for x in generated['files']}
          assert set(ffiles) == set(gfiles), (set(ffiles) ^ set(gfiles))
          for path in sorted(ffiles):
              for key in ('bytes', 'records', 'sha256'):
                  assert gfiles[path][key] == ffiles[path][key], (path, key, gfiles[path][key], ffiles[path][key])

          print('Frozen corpus verified:', generated['global_sha256'])

      - name: Install zstd
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Build deterministic distribution assets
        run: |
          cp manifests/ZMDC-1G-v1.json dist/ZMDC-1G-v1/manifest.json
          cp manifests/ZMDC-1G-v1.json dist/ZMDC-1G-v1.manifest.json
          cd dist
          tar \
            --sort=name \
            --mtime='UTC 2026-09-14 00:00:00' \
            --owner=0 --group=0 --numeric-owner \
            -cf - ZMDC-1G-v1 | zstd -10 -T1 -o ZMDC-1G-v1.tar.zst
          sha256sum ZMDC-1G-v1.tar.zst ZMDC-1G-v1.manifest.json > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 \
              dist/ZMDC-1G-v1.tar.zst \
              dist/ZMDC-1G-v1.manifest.json \
              dist/SHA256SUMS \
              --clobber
            gh release edit v1.0.0 \
              --title 'ZMDC-1G v1.0' \
              --notes-file RELEASE_NOTES_v1.0.md
          else
            gh release create v1.0.0 \
              --target "$GITHUB_SHA" \
              --title 'ZMDC-1G v1.0' \
              --notes-file RELEASE_NOTES_v1.0.md \
              dist/ZMDC-1G-v1.tar.zst \
              dist/ZMDC-1G-v1.manifest.json \
              dist/SHA256SUMS
          fi
